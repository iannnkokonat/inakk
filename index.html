<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>innaa ailafyuu</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts: Playfair Display (Serif) & Plus Jakarta Sans (Modern Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,400;1,600;1,700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['"Playfair Display"', 'serif'],
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        /* Reset & Base Pure Black Canvas */
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            color: #ffffff;
            overflow: hidden;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        /* Bingkai Utama Rasio 16:9 yang Presisi di Tengah Layar */
        .stage-16-9 {
            position: relative;
            width: min(96vw, calc(94vh * (16 / 9)));
            aspect-ratio: 16 / 9;
            background-color: #050507;
            border-radius: 1.25rem;
            overflow: hidden;
            box-shadow:
                0 30px 90px rgba(0, 0, 0, 0.95),
                0 0 0 1px rgba(255, 255, 255, 0.08);
            transform: scale(0.96);
            transition: transform 2.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .stage-16-9.revealed {
            transform: scale(1);
        }

        @media (max-width: 768px) {
            .stage-16-9 {
                width: 100vw;
                max-width: 100vw;
                max-height: 100vh;
                border-radius: 0;
                box-shadow: none;
            }
        }

        /* Mode fallback layar penuh untuk HP (terutama iOS Safari yang membatasi requestFullscreen) */
        body.mobile-pseudo-fullscreen .stage-16-9 {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            max-width: none;
            max-height: none;
            aspect-ratio: auto;
            border-radius: 0;
            z-index: 40;
        }

        /* =========================================================
           ANIMASI TRANSISI SINEMATIK RINGAN (GPU-ACCELERATED)
           ========================================================= */
        .photo-slide {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            z-index: 1;
            transform: translate3d(0, 0, 0) scale(1.03);
            will-change: transform, opacity;
            backface-visibility: hidden;
            transition: opacity 1.35s cubic-bezier(0.22, 1, 0.36, 1);
            animation-play-state: paused;
        }

        .photo-slide.is-active {
            opacity: 1;
            z-index: 3;
            animation-play-state: running;
        }

        .photo-slide.is-leaving {
            opacity: 0;
            z-index: 2;
            animation-play-state: paused;
        }

        .photo-slide.anim-zoom-in {
            animation: motionZoomIn 12s linear forwards;
        }

        @keyframes motionZoomIn {
            0% { transform: translate3d(0%, 0%, 0) scale(1.0); }
            100% { transform: translate3d(-1%, -1%, 0) scale(1.09); }
        }

        .photo-slide.anim-pan-right {
            animation: motionPanRight 12s linear forwards;
        }

        @keyframes motionPanRight {
            0% { transform: translate3d(-2%, 0%, 0) scale(1.08); }
            100% { transform: translate3d(2%, -0.5%, 0) scale(1.08); }
        }

        .photo-slide.anim-zoom-out {
            animation: motionZoomOut 12s linear forwards;
        }

        @keyframes motionZoomOut {
            0% { transform: translate3d(0.8%, 0.8%, 0) scale(1.11); }
            100% { transform: translate3d(0%, 0%, 0) scale(1.01); }
        }

        .photo-slide.anim-pan-left {
            animation: motionPanLeft 12s linear forwards;
        }

        @keyframes motionPanLeft {
            0% { transform: translate3d(2%, 0.5%, 0) scale(1.08); }
            100% { transform: translate3d(-2%, -0.5%, 0) scale(1.08); }
        }

        .photo-slide.anim-drift-diagonal {
            animation: motionDriftDiagonal 12s linear forwards;
        }

        @keyframes motionDriftDiagonal {
            0% { transform: translate3d(-1.2%, 1.2%, 0) scale(1.02); }
            100% { transform: translate3d(1.2%, -1.2%, 0) scale(1.09); }
        }

        /* =========================================================
           TIPOGRAFI KINETIK (KINETIC LYRIC TYPOGRAPHY)
           ========================================================= */
        .lyric-wrapper {
            transition: opacity 0.65s ease, transform 0.65s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .lyric-wrapper.switching {
            opacity: 0;
            transform: translateY(-14px) scale(0.98);
        }

        .k-word {
            display: inline-block;
            opacity: 0.18;
            transform: translateY(18px) scale(0.94);
            filter: blur(6px);
            transition:
                opacity 0.65s cubic-bezier(0.16, 1, 0.3, 1),
                transform 0.65s cubic-bezier(0.16, 1, 0.3, 1),
                filter 0.65s cubic-bezier(0.16, 1, 0.3, 1),
                text-shadow 0.65s ease,
                color 0.65s ease;
            margin: 0 0.16em;
        }

        .k-word.revealed {
            opacity: 1;
            transform: translateY(0px) scale(1);
            filter: blur(0px);
            color: #fffafd;
            text-shadow:
                0 2px 14px rgba(0, 0, 0, 0.85),
                0 0 12px rgba(255, 255, 255, 0.36),
                0 0 24px rgba(255, 195, 222, 0.22);
        }

        /* =========================================================
           LAYAR TIRAI HITAM & TOMBOL BUBBLE SOFT PINK
           ========================================================= */
        .black-curtain {
            position: fixed;
            inset: 0;
            z-index: 9990;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #000000;
            opacity: 1;
            pointer-events: auto;
            transition: opacity 1.35s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .black-curtain.fade-away,
        .black-curtain.is-dismissed {
            opacity: 0;
            pointer-events: none;
        }

        .bubble-btn {
            position: relative;
            z-index: 9995;
            pointer-events: auto;
            touch-action: manipulation;
            width: 6.25rem;
            height: 6.25rem;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #fff5f9;
            background: radial-gradient(circle at 30% 25%, rgba(255, 240, 247, 0.72), rgba(249, 168, 212, 0.34) 55%, rgba(244, 114, 182, 0.24) 100%);
            border: 1px solid rgba(251, 207, 232, 0.65);
            box-shadow:
                inset 0 2px 10px rgba(255, 255, 255, 0.65),
                inset 0 -8px 18px rgba(244, 114, 182, 0.35),
                0 0 34px rgba(244, 114, 182, 0.38),
                0 14px 32px rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            animation: bubbleFloat 3.4s ease-in-out infinite;
            transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.35s ease, box-shadow 0.35s ease;
        }

        .bubble-btn > * {
            pointer-events: none;
        }

        .bubble-btn:hover {
            transform: scale(1.07);
            box-shadow:
                inset 0 2px 12px rgba(255, 255, 255, 0.8),
                inset 0 -8px 20px rgba(244, 114, 182, 0.45),
                0 0 46px rgba(249, 168, 212, 0.58),
                0 18px 36px rgba(0, 0, 0, 0.8);
        }

        .bubble-btn:active {
            transform: scale(0.95);
        }

        .bubble-btn.bubble-pop {
            transform: scale(1.42);
            opacity: 0;
            pointer-events: none;
        }

        @keyframes bubbleFloat {
            0%, 100% {
                transform: translate3d(0, 0, 0);
            }
            50% {
                transform: translate3d(0, -6px, 0);
            }
        }

        /* Kontrol khusus HP (Saran Landscape & Tombol Fullscreen) */
        .mobile-controls {
            display: none;
        }

        @media (hover: none) and (pointer: coarse), (max-width: 768px) {
            .mobile-controls {
                display: block;
            }
        }
    </style>
</head>
<body class="flex items-center justify-center bg-black">

    <!-- Kontrol Khusus HP: Banner Saran Landscape & Tombol Fullscreen -->
    <div class="mobile-controls fixed inset-x-0 top-0 z-[10000] pointer-events-none p-3">
        <div class="flex items-start justify-between gap-2">
            <!-- Peringatan Saran Mode Landscape saat posisi portrait -->
            <div id="landscape-hint-banner" class="pointer-events-auto hidden items-center gap-2.5 rounded-full bg-zinc-950/90 border border-pink-300/35 px-3.5 py-2 text-xs text-pink-100 shadow-lg backdrop-blur-md">
                <svg class="w-4 h-4 shrink-0 text-pink-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="4" y="6" width="16" height="12" rx="2"></rect>
                    <path d="M12 3v1"></path>
                    <path d="M12 20v1"></path>
                </svg>
                <span>Putar HP ke <strong>Landscape</strong> agar rasio 16:9 lebih pas</span>
                <button id="dismiss-landscape-btn" type="button" class="ml-1 text-pink-200/70 hover:text-white text-xs px-1" aria-label="Tutup saran">✕</button>
            </div>

            <!-- Tombol Fullscreen Khusus HP -->
            <button id="mobile-fullscreen-btn" type="button" class="pointer-events-auto ml-auto flex items-center gap-1.5 rounded-full bg-zinc-950/90 border border-white/20 px-3.5 py-2 text-xs font-medium text-white shadow-lg backdrop-blur-md active:scale-95 transition" aria-label="Mode Layar Penuh">
                <svg id="fs-icon-enter" class="w-4 h-4 text-pink-200" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M8 3H5a2 2 0 0 0-2 2v3"></path>
                    <path d="M21 8V5a2 2 0 0 0-2-2h-3"></path>
                    <path d="M3 16v3a2 2 0 0 0 2 2h3"></path>
                    <path d="M16 21h3a2 2 0 0 0 2-2v-3"></path>
                </svg>
                <svg id="fs-icon-exit" class="w-4 h-4 text-pink-200 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M8 3v3a2 2 0 0 1-2 2H3"></path>
                    <path d="M21 8h-3a2 2 0 0 1-2-2V3"></path>

        </div>
    </div>

    <!-- Tirai Hitam Pembuka & Penutup dengan Tombol Bubble Soft Pink -->
    <div id="black-curtain" class="black-curtain">
        <button id="bubble-action-btn" type="button" class="bubble-btn" aria-label="Putar Tayangan">
            <svg id="icon-play" class="w-9 h-9 translate-x-0.5 drop-shadow" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M8 5.5v13l10.5-6.5L8 5.5z"></path>
            </svg>
            <svg id="icon-replay" class="w-8 h-8 hidden drop-shadow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path>
                <path d="M3 3v5h5"></path>
            </svg>
        </button>
    </div>

    <!-- Latar Belakang Ambient Ringan di Luar Frame 16:9 -->
    <div id="ambient-backdrop" class="fixed inset-0 pointer-events-none opacity-15 scale-105 bg-cover bg-center transition-opacity duration-1000 z-0" style="background: radial-gradient(circle at center, rgba(255, 165, 206, 0.14) 0%, #000000 72%);"></div>

    <!-- Panggung Utama Rasio 16:9 (6 Foto + Tipografi Lirik) -->
    <main id="stage-16-9" class="stage-16-9 z-10 flex items-center justify-center">
        <!-- Layer 1: 6 Foto 16:9 -->
        <div id="photo-layer" class="absolute inset-0 w-full h-full pointer-events-none"></div>

        <!-- Layer 2: Gradient Gelap Sinematik Ringan -->
        <div class="absolute inset-0 z-10 pointer-events-none bg-gradient-to-t from-black/75 via-black/30 to-black/50"></div>

        <!-- Layer 3: Tipografi Lirik Kinetik -->
        <div class="relative z-20 w-full max-w-4xl px-6 sm:px-14 md:px-20 text-center pointer-events-none">
            <div id="lyric-wrapper" class="lyric-wrapper flex flex-col items-center justify-center">
                <h1 id="lyric-main-text" class="font-serif italic font-semibold text-2xl sm:text-4xl md:text-5xl lg:text-[3.4rem] leading-snug text-white">
                    &nbsp;
                </h1>
            </div>
        </div>
    </main>

    <script>
        const AUDIO_URL = "audio.mp3";
        const DEFAULT_DURATION = 84.32;

        const PHOTOS = [
            { url: "foto1.jpeg", transition: "anim-zoom-in" },
            { url: "foto2.jpeg", transition: "anim-pan-right" },
            { url: "foto3.jpeg", transition: "anim-zoom-out" },
            { url: "foto4.jpeg", transition: "anim-pan-left" },
            { url: "foto5.jpeg", transition: "anim-zoom-in" },
            { url: "foto6.jpeg", transition: "anim-drift-diagonal" }
        ];

        const LYRICS = [
            { time: 6.0, text: "Sebentar saja ku ingin cerita" },
            { time: 12.0, text: "Tentang dia yang teristimewa" },
            { time: 18.5, text: "Kadang lucu kadang menyebalkan ya..." },
            { time: 24.8, text: "Oh... tapi aku suka" },
            { time: 31.0, text: "Dia tak pandai merangkai kata-kata" },
            { time: 37.0, text: "Romantisnya pun seadanya" },
            { time: 43.5, text: "Tapi aku bingung entah kenapa" },
            { time: 49.8, text: "Oh... nyaman di dekatnya" },
            { time: 57.5, text: "Aku suka sama kamu" },
            { time: 63.8, text: "Aku aman di dekatmu" },
            { time: 70.0, text: "Aku nyaman bersamamu" },
            { time: 76.5, text: "Aku senang punya kamu" }
        ];

        class AmbientPianoEngine {
            constructor() {
                this.ctx = null;
                this.masterGain = null;
                this.timer = null;
                this.isPlaying = false;
                this.step = 0;

                this.chords = [
                    [261.63, 329.63, 392.00, 493.88],
                    [220.00, 261.63, 329.63, 392.00],
                    [174.61, 220.00, 261.63, 329.63],
                    [196.00, 246.94, 293.66, 329.63]
                ];
                this.melody = [523.25, 493.88, 392.00, 440.00, 329.63, 392.00, 293.66, 329.63];
            }

            init() {
                try {
                    if (!this.ctx) {
                        const AudioContext = window.AudioContext || window.webkitAudioContext;
                        if (!AudioContext) return;
                        this.ctx = new AudioContext();
                        this.masterGain = this.ctx.createGain();
                        this.masterGain.gain.setValueAtTime(0.36, this.ctx.currentTime);
                        this.masterGain.connect(this.ctx.destination);
                    }
                    if (this.ctx && this.ctx.state === "suspended") {
                        this.ctx.resume().catch(() => {});
                    }
                } catch (_) {}
            }

            playNote(freq, duration, gainPeak = 0.08, type = "sine") {
                if (!this.ctx || !this.masterGain) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, now);

                gain.gain.setValueAtTime(0.0001, now);
                gain.gain.linearRampToValueAtTime(gainPeak, now + 0.08);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

                osc.connect(gain);
                gain.connect(this.masterGain);
                osc.start(now);
                osc.stop(now + duration + 0.05);
            }

            tick() {
                if (!this.ctx || !this.isPlaying) return;
                const chordIdx = Math.floor(this.step / 8) % this.chords.length;
                const chord = this.chords[chordIdx];

                if (this.step % 8 === 0) {
                    chord.forEach((freq) => this.playNote(freq, 5.2, 0.045, "sine"));
                }

                const note = this.melody[this.step % this.melody.length];
                this.playNote(note, 1.4, 0.07, "triangle");
                this.step++;
            }

            start() {
                this.init();
                if (!this.ctx || !this.masterGain || this.isPlaying) return;
                this.isPlaying = true;
                this.step = 0;
                try {
                    this.masterGain.gain.cancelScheduledValues(this.ctx.currentTime);
                    this.masterGain.gain.setValueAtTime(0.01, this.ctx.currentTime);
                    this.masterGain.gain.linearRampToValueAtTime(0.36, this.ctx.currentTime + 1.5);
                } catch (_) {}

                this.tick();
                this.timer = setInterval(() => this.tick(), 750);
            }

            stop() {
                this.isPlaying = false;
                if (this.timer) {
                    clearInterval(this.timer);
                    this.timer = null;
                }
            }
        }

        const blackCurtain = document.getElementById("black-curtain");
        const bubbleActionBtn = document.getElementById("bubble-action-btn");
        const iconPlay = document.getElementById("icon-play");
        const iconReplay = document.getElementById("icon-replay");
        const stage16x9 = document.getElementById("stage-16-9");
        const photoLayer = document.getElementById("photo-layer");
        const lyricWrapper = document.getElementById("lyric-wrapper");
        const lyricMainText = document.getElementById("lyric-main-text");

        const landscapeBanner = document.getElementById("landscape-hint-banner");
        const dismissLandscapeBtn = document.getElementById("dismiss-landscape-btn");
        const mobileFullscreenBtn = document.getElementById("mobile-fullscreen-btn");
        const fsIconEnter = document.getElementById("fs-icon-enter");
        const fsIconExit = document.getElementById("fs-icon-exit");
        const fsLabel = document.getElementById("fs-label");

        const pianoEngine = new AmbientPianoEngine();
        const customAudio = AUDIO_URL ? new Audio(AUDIO_URL) : null;
        if (customAudio) {
            customAudio.preload = "metadata";
        }

        const playbackState = {
            isRunning: false,
            isEnding: false,
            elapsed: 0,
            totalDuration: DEFAULT_DURATION,
            currentPhotoIdx: -1,
            currentLyricIdx: -1,
            lastTimestamp: 0,
            rafId: null,
            wordTimers: [],
            landscapeDismissed: false,
            pseudoFullscreen: false
        };

        function buildPhotoElements() {
            if (!photoLayer || photoLayer.children.length > 0) return;
            PHOTOS.forEach((photo, idx) => {
                const img = document.createElement("img");
                img.src = photo.url;
                img.alt = `Foto sinematik ${idx + 1}`;
                img.className = `photo-slide ${photo.transition}`;
                img.dataset.index = String(idx);
                photoLayer.appendChild(img);
            });
        }

        function activatePhoto(index) {
            if (!photoLayer) return;
            const slides = Array.from(photoLayer.querySelectorAll(".photo-slide"));
            if (!slides.length) return;

            const safeIdx = ((index % slides.length) + slides.length) % slides.length;
            if (safeIdx === playbackState.currentPhotoIdx) return;

            slides.forEach((slide, i) => {
                slide.classList.remove("is-active", "is-leaving");
                if (i === playbackState.currentPhotoIdx) {
                    slide.classList.add("is-leaving");
                }
            });

            const activeSlide = slides[safeIdx];
            activeSlide.style.animation = "none";
            void activeSlide.offsetWidth;
            activeSlide.style.animation = "";
            activeSlide.classList.add("is-active");

            playbackState.currentPhotoIdx = safeIdx;
        }

        function clearWordTimers() {
            playbackState.wordTimers.forEach((id) => clearTimeout(id));
            playbackState.wordTimers = [];
        }

        function renderLyricLine(text) {
            clearWordTimers();
            if (!lyricMainText || !lyricWrapper) return;

            lyricWrapper.classList.add("switching");

            const switchTimer = setTimeout(() => {
                const words = text.trim().split(/\s+/);
                lyricMainText.innerHTML = words
                    .map((word, idx) => `<span class="k-word" data-widx="${idx}">${word}</span>`)
                    .join("");

                lyricWrapper.classList.remove("switching");

                const spans = lyricMainText.querySelectorAll(".k-word");
                spans.forEach((span, i) => {
                    const t = setTimeout(() => {
                        span.classList.add("revealed");
                    }, 90 + i * 130);
                    playbackState.wordTimers.push(t);
                });
            }, 220);

            playbackState.wordTimers.push(switchTimer);
        }

        function finishPlayback() {
            if (playbackState.isEnding) return;
            playbackState.isEnding = true;
            playbackState.isRunning = false;

            if (playbackState.rafId) {
                cancelAnimationFrame(playbackState.rafId);
                playbackState.rafId = null;
            }
            clearWordTimers();
            pianoEngine.stop();

            if (customAudio) {
                try {
                    customAudio.pause();
                } catch (_) {}
            }

            if (iconPlay) iconPlay.classList.add("hidden");
            if (iconReplay) iconReplay.classList.remove("hidden");

            if (stage16x9) stage16x9.classList.remove("revealed");
            if (blackCurtain) blackCurtain.classList.remove("fade-away", "is-dismissed");

            setTimeout(() => {
                if (bubbleActionBtn) bubbleActionBtn.classList.remove("bubble-pop");
            }, 600);
        }

        function updateLoop(timestamp) {
            if (!playbackState.isRunning) return;

            const dt = Math.min(0.25, Math.max(0, (timestamp - playbackState.lastTimestamp) / 1000));
            playbackState.lastTimestamp = timestamp;

            if (customAudio && !customAudio.paused && !customAudio.ended && !isNaN(customAudio.currentTime)) {
                playbackState.elapsed = customAudio.currentTime;
            } else {
                playbackState.elapsed += dt;
            }

            const total = playbackState.totalDuration || DEFAULT_DURATION;
            const photoSpan = total / PHOTOS.length;
            const targetPhotoIdx = Math.min(PHOTOS.length - 1, Math.floor(playbackState.elapsed / photoSpan));
            if (targetPhotoIdx !== playbackState.currentPhotoIdx) {
                activatePhoto(targetPhotoIdx);
            }

            let activeLyricIdx = -1;
            for (let i = LYRICS.length - 1; i >= 0; i--) {
                if (playbackState.elapsed >= LYRICS[i].time) {
                    activeLyricIdx = i;
                    break;
                }
            }

            if (activeLyricIdx !== -1 && activeLyricIdx !== playbackState.currentLyricIdx) {
                playbackState.currentLyricIdx = activeLyricIdx;
                renderLyricLine(LYRICS[activeLyricIdx].text);
            }

            if (playbackState.elapsed >= total || (customAudio && customAudio.ended)) {
                finishPlayback();
                return;
            }

            playbackState.rafId = requestAnimationFrame(updateLoop);
        }

        function startPlayback() {
            if (playbackState.isRunning) return;

            buildPhotoElements();

            if (bubbleActionBtn) {
                bubbleActionBtn.classList.add("bubble-pop");
            }

            playbackState.isRunning = true;
            playbackState.isEnding = false;
            playbackState.elapsed = 0;
            playbackState.currentPhotoIdx = -1;
            playbackState.currentLyricIdx = -1;
            clearWordTimers();

            if (lyricMainText) {
                lyricMainText.innerHTML = "&nbsp;";
            }

            activatePhoto(0);

            if (customAudio) {
                try {
                    customAudio.currentTime = 0;
                    customAudio.volume = 1;
                    const playPromise = customAudio.play();
                    if (playPromise && typeof playPromise.catch === "function") {
                        playPromise.catch(() => pianoEngine.start());
                    }
                } catch (_) {
                    pianoEngine.start();
                }
            } else {
                pianoEngine.start();
            }

            setTimeout(() => {
                if (blackCurtain) {
                    blackCurtain.classList.add("fade-away", "is-dismissed");
                }
                if (stage16x9) {
                    stage16x9.classList.add("revealed");
                }
            }, 250);

            if (playbackState.rafId) {
                cancelAnimationFrame(playbackState.rafId);
            }
            playbackState.lastTimestamp = performance.now();
            playbackState.rafId = requestAnimationFrame(updateLoop);
        }

        function isPortraitMobile() {
            const isSmallScreen = window.innerWidth <= 900 || window.matchMedia("(pointer: coarse)").matches;
            const isPortrait = window.innerHeight > window.innerWidth;
            return isSmallScreen && isPortrait;
        }

        function updateLandscapeBanner() {
            if (!landscapeBanner) return;
            if (isPortraitMobile() && !playbackState.landscapeDismissed) {
                landscapeBanner.classList.remove("hidden");
                landscapeBanner.classList.add("flex");
            } else {
                landscapeBanner.classList.add("hidden");
                landscapeBanner.classList.remove("flex");
            }
        }

        function isFullscreenActive() {
            return Boolean(
                document.fullscreenElement ||
                document.webkitFullscreenElement ||
                playbackState.pseudoFullscreen
            );
        }

        function syncFullscreenUi() {
            const active = isFullscreenActive();
            if (fsIconEnter) fsIconEnter.classList.toggle("hidden", active);
            if (fsIconExit) fsIconExit.classList.toggle("hidden", !active);
            if (fsLabel) fsLabel.textContent = active ? "Keluar FS" : "Fullscreen";
        }

        async function toggleMobileFullscreen() {
            const target = document.documentElement;
            try {
                if (!isFullscreenActive()) {
                    if (target.requestFullscreen) {
                        await target.requestFullscreen();
                    } else if (target.webkitRequestFullscreen) {
                        target.webkitRequestFullscreen();
                    } else {
                        playbackState.pseudoFullscreen = true;
                        document.body.classList.add("mobile-pseudo-fullscreen");
                    }
                } else {
                    if (document.fullscreenElement && document.exitFullscreen) {
                        await document.exitFullscreen();
                    } else if (document.webkitFullscreenElement && document.webkitExitFullscreen) {
                        document.webkitExitFullscreen();
                    }
                    playbackState.pseudoFullscreen = false;
                    document.body.classList.remove("mobile-pseudo-fullscreen");
                }
            } catch (_) {
                // Fallback jika Fullscreen API ditolak browser/iOS
                playbackState.pseudoFullscreen = !playbackState.pseudoFullscreen;
                document.body.classList.toggle("mobile-pseudo-fullscreen", playbackState.pseudoFullscreen);
            }
            syncFullscreenUi();
        }

        if (bubbleActionBtn) {
            bubbleActionBtn.addEventListener("click", (e) => {
                e.preventDefault();
                startPlayback();
            });
        }

        if (dismissLandscapeBtn) {
            dismissLandscapeBtn.addEventListener("click", () => {
                playbackState.landscapeDismissed = true;
                updateLandscapeBanner();
            });
        }

        if (mobileFullscreenBtn) {
            mobileFullscreenBtn.addEventListener("click", (e) => {
                e.preventDefault();
                toggleMobileFullscreen();
            });
        }

        document.addEventListener("fullscreenchange", () => {
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                playbackState.pseudoFullscreen = false;
                document.body.classList.remove("mobile-pseudo-fullscreen");
            }
            syncFullscreenUi();
        });

        document.addEventListener("webkitfullscreenchange", () => {
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                playbackState.pseudoFullscreen = false;
                document.body.classList.remove("mobile-pseudo-fullscreen");
            }
            syncFullscreenUi();
        });

        window.addEventListener("resize", updateLandscapeBanner);
        window.addEventListener("orientationchange", () => {
            setTimeout(updateLandscapeBanner, 120);
        });

        window.addEventListener("DOMContentLoaded", () => {
            buildPhotoElements();
            updateLandscapeBanner();
            syncFullscreenUi();

            if (customAudio) {
                customAudio.addEventListener("loadedmetadata", () => {
                    if (customAudio.duration && !isNaN(customAudio.duration)) {
                        playbackState.totalDuration = customAudio.duration;
                    }
                });
            }
        });
    </script>
</body>
</html>
